name: Documentation

on:
  pull_request:
    paths:
      - ".github/workflows/docs.yml"
      - "docs/**"
      - "examples/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "src/**"
      - "uv.lock"
  push:
    branches: [main]
    paths:
      - ".github/workflows/docs.yml"
      - "docs/**"
      - "examples/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "src/**"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install ".[docs]"
      - name: Run documented examples
        run: |
          python examples/quickstart.py
          python examples/linear_kalman_filter.py
          python examples/se2_localisation.py
          python examples/particle_localisation.py
      - run: mkdocs build --strict
